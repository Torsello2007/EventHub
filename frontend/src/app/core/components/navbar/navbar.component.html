<nav class="bg-indigo-700 text-white shadow-lg">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <a routerLink="/" class="text-2xl font-bold tracking-tighter">EventHub</a>
    <div class="flex items-center space-x-6">
      <a routerLink="/" class="hover:text-indigo-200">Home</a>
      <a routerLink="/eventi" class="hover:text-indigo-200">Eventi</a>
      
      @if (auth.isLoggedIn()) {
        <a routerLink="/profile" class="hover:text-indigo-200">Profilo</a>

      } @else {
        <button (click)="auth.login()" class="bg-white text-indigo-700 px-4 py-2 rounded-lg font-semibold hover:bg-indigo-50 transition">
          Accedi
        </button>
      }
    </div>
  </div>
</nav>
